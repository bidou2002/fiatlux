name: Local GUI
on:
  pull_request:
    paths: ['fiatlux_app/**', 'tests/test_gui*', 'tests/test_canvas*', 'scripts/gui_smoke.py', 'scripts/canvas_smoke.py', 'pyproject.toml', '.github/workflows/gui.yml']
  push:
    branches: [main]
    paths: ['fiatlux_app/**', 'tests/test_gui*', 'tests/test_canvas*', 'scripts/gui_smoke.py', 'scripts/canvas_smoke.py', 'pyproject.toml', '.github/workflows/gui.yml']
jobs:
  local-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core, tests and browser verification tools
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[all,dev]' playwright
          python -m playwright install --with-deps chromium
      - name: Format the native frontend for review
        run: |
          npx --yes prettier@3.6.2 --write fiatlux_app/static/canvas.js fiatlux_app/static/canvas.css
          mkdir -p gui-captures/source
          cp fiatlux_app/static/canvas.js fiatlux_app/static/canvas.css gui-captures/source/
      - name: Verify configuration and numerical equivalence
        run: python -m pytest tests/test_gui_model.py tests/test_gui_engine.py tests/test_canvas_graph.py tests/test_canvas_engine.py tests/test_canvas_revisions.py -q
      - name: Exercise localhost with real FIATLUX results
        run: |
          python scripts/gui_smoke.py gui-captures
          python scripts/canvas_smoke.py gui-captures/canvas
      - name: Publish visual verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiatlux-gui-captures
          path: gui-captures/
