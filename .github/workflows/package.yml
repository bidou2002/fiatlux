name: Package

on:
  push:
    branches: [main]
  pull_request:

jobs:
  clean-install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core package
        run: python -m pip install .
      - name: Test isolated core import
        run: python -I -c "import fiatlux; print(fiatlux.__version__)"
      - name: Inspect installed metadata
        run: |
          python - <<'PY'
          from importlib.metadata import metadata
          package = metadata("fiatlux")
          assert package["License-Expression"] == "MIT"
          assert package["Requires-Python"] == ">=3.10"
          PY

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install '.[all,dev]'
      - run: python -m pytest -q
