name: Package

on:
  push:
    branches: [main]
  pull_request:

jobs:
  clean-install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core package
        run: python -m pip install .
      - name: Test isolated core import
        run: |
          python -I - <<'PY'
          import sys
          import fiatlux

          optional_modules = {"astropy", "matplotlib", "scipy", "torchvision"}
          loaded = optional_modules.intersection(sys.modules)
          assert not loaded, f"unexpected optional imports: {sorted(loaded)}"
          assert all(hasattr(fiatlux, name) for name in fiatlux.__all__)
          print(fiatlux.__version__)
          PY
      - name: Inspect installed metadata
        run: |
          python - <<'PY'
          from importlib.metadata import metadata
          package = metadata("fiatlux")
          assert package["License-Expression"] == "MIT"
          assert package["Requires-Python"] == ">=3.10"
          PY

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install '.[all,dev]'
      - run: python -m pytest -q

  tutorials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install '.[tutorials]'
      - name: Create synthetic HARMONI dataset
        env:
          FIATLUX_HARMONI_DATA: ${{ runner.temp }}/harmoni-residuals
        run: |
          mkdir -p "$FIATLUX_HARMONI_DATA"
          python - <<'PY'
          import os
          from pathlib import Path
          import numpy as np
          from astropy.io import fits

          size = 400
          y, x = np.ogrid[:size, :size]
          pupil = (x - size // 2) ** 2 + (y - size // 2) ** 2 <= (size // 2 - 2) ** 2
          data = np.zeros((2, 2, size, size), dtype=np.float32)
          data[1, 0, pupil] = 50e-9
          data[1, 1, pupil] = -50e-9
          fits.PrimaryHDU(data).writeto(
              Path(os.environ["FIATLUX_HARMONI_DATA"]) / "synthetic.fits"
          )
          PY
      - name: Execute tutorials independently
        env:
          FIATLUX_HARMONI_DATA: ${{ runner.temp }}/harmoni-residuals
          MPLBACKEND: Agg
        run: |
          mkdir -p "${{ runner.temp }}/executed-notebooks"
          for notebook in tutorials/*.ipynb; do
            jupyter nbconvert \
              --to notebook \
              --execute "$notebook" \
              --output "$(basename "$notebook")" \
              --output-dir "${{ runner.temp }}/executed-notebooks" \
              --ExecutePreprocessor.timeout=300
          done
